<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Stand Our Watch - Interactive Frame</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Playfair Display for elegant maritime theme -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0A192F',
                        navy_light: '#112240',
                        gold: '#D4AF37',
                        gold_light: '#F3E5AB',
                        parchment: '#f4f1ea' /* Added parchment color for light theme */
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050b14; /* Deep dark ocean background */
            font-family: 'Inter', sans-serif;
        }

        /* 
         * Hotspot Styling
         * Kept transparent by default, but transitions to a subtle gold highlight on hover
         */
        .hotspot {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            border-radius: 8px;
            z-index: 10;
        }

        .hotspot:hover {
            background-color: rgba(212, 175, 55, 0.15); /* Faint gold tint */
            border-color: rgba(212, 175, 55, 0.8); /* Gold border */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Hotspot tooltip */
        .hotspot::after {
            content: attr(data-label);
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(244, 241, 234, 0.95); /* Light parchment background to match new theme */
            color: #0A192F; /* Navy text */
            padding: 8px 16px;
            border: 1px solid #0A192F; /* Navy border */
            border-radius: 4px;
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .hotspot:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Modal Transitions */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .media-fade {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Custom Scrollbar for modal content if it overflows */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0A192F; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- MAIN DISPLAY CONTAINER -->
    <main class="relative w-full max-w-[1400px] mx-auto shadow-2xl">
        
        <!-- The Main Provided Image -->
        <!-- Ensure the image scales responsively and keeps its aspect ratio -->
        <img src="Gemini_Generated_Image_nnra02nnra02nnra.jpg" 
             alt="Commemorative Ship Photo Frame" 
             class="w-full h-auto block rounded-sm shadow-[0_0_50px_rgba(0,0,0,0.8)]">

        <!-- 
          HOTSPOT 1: 55 Crew (Center Area)
          Using percentage-based positioning so it scales perfectly with the image
        -->
        <div class="hotspot" 
             style="top: 12%; left: 30%; width: 40%; height: 74%;" 
             data-label="View 55 Crew Memories"
             onclick="openGallery('crew55')"
             title="Click to view 55 Crew memories">
        </div>

        <!-- 
          HOTSPOT 2: Wild Wild Wet (Bottom Left Area)
        -->
        <div class="hotspot" 
             style="top: 70%; left: 5%; width: 33%; height: 21%;" 
             data-label="View Wild Wild Wet Gallery"
             onclick="openGallery('wildwildwet')"
             title="Click to view Wild Wild Wet memories">
        </div>

        <!-- 
          HOTSPOT 3: Commissioning Anniversary (Example Top Right Area)
          
          HOW TO ADD MORE PHOTOS/HOTSPOTS:
          1. Copy an existing <div class="hotspot"> block like this one.
          2. Change the 'onclick' to a unique name, e.g., openGallery('newGallery').
          3. Adjust the 'style' attribute to position it over your target image:
             - 'top': percentage from the top edge of the frame (e.g., 10%)
             - 'left': percentage from the left edge of the frame (e.g., 70%)
             - 'width': how wide the clickable area should be (e.g., 20%)
             - 'height': how tall the clickable area should be (e.g., 15%)
          4. Add the corresponding data in the `galleryData` JavaScript object below.
        -->
        <div class="hotspot" 
             style="top: 15%; left: 75%; width: 20%; height: 18%;" 
             data-label="Commissioning Anniversary"
             onclick="openGallery('anniversary')"
             title="Click to view Commissioning Anniversary">
        </div>
    </main>

    <!-- MODAL / LIGHTBOX -->
    <!-- Changed bg-black/90 to bg-black/75 to make the background frame barely visible -->
    <div id="gallery-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 sm:p-8">
        
        <!-- Modal Content Container (Light Theme: Parchment & Navy) -->
        <div class="bg-parchment border border-navy/30 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.5)] w-full max-w-6xl h-[85vh] flex flex-col relative overflow-hidden">
            
            <!-- Modal Header -->
            <header class="flex justify-between items-center p-5 sm:p-6 border-b border-navy/10 bg-white/40 shrink-0">
                <div class="flex flex-col">
                    <!-- Ship Motto -->
                    <p class="text-navy/70 text-xs sm:text-sm tracking-[0.3em] font-sans font-medium uppercase mb-1">
                        We Stand Our Watch
                    </p>
                    <h2 id="modal-title" class="font-serif text-2xl sm:text-4xl font-bold text-navy m-0 drop-shadow-sm">
                        Gallery Title
                    </h2>
                </div>
                
                <button onclick="closeGallery()" class="text-navy/60 hover:text-navy hover:bg-navy/10 transition-colors w-12 h-12 flex justify-center items-center rounded-full text-2xl focus:outline-none" title="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>

            <!-- Modal Body: Media Carousel -->
            <!-- Transparent background so the parchment texture flows through -->
            <div class="flex-1 relative flex items-center justify-center bg-transparent overflow-hidden group">
                
                <!-- Left Nav -->
                <button onclick="prevMedia()" class="absolute left-2 sm:left-6 z-20 w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center rounded-full bg-white/90 border border-navy/20 text-navy hover:bg-navy hover:text-white transition-all text-xl sm:text-2xl opacity-0 group-hover:opacity-100 focus:opacity-100 focus:outline-none disabled:opacity-30 shadow-md">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <!-- Media Display Area -->
                <div id="media-container" class="w-full h-full flex items-center justify-center p-4 sm:p-12 relative z-10">
                    <!-- Image or Video injected here by JS -->
                </div>

                <!-- Right Nav -->
                <button onclick="nextMedia()" class="absolute right-2 sm:right-6 z-20 w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center rounded-full bg-white/90 border border-navy/20 text-navy hover:bg-navy hover:text-white transition-all text-xl sm:text-2xl opacity-0 group-hover:opacity-100 focus:opacity-100 focus:outline-none disabled:opacity-30 shadow-md">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Modal Footer: Caption & Counter -->
            <footer class="p-4 sm:p-6 border-t border-navy/10 bg-white/40 shrink-0 text-center flex flex-col items-center justify-center">
                <p id="media-caption" class="text-navy font-sans text-base sm:text-lg min-h-[1.75rem] max-w-3xl mx-auto font-medium">
                    <!-- Caption injected via JS -->
                </p>
                <div id="media-indicators" class="flex gap-2 mt-4">
                    <!-- Dots injected via JS -->
                </div>
            </footer>
        </div>
    </div>

    <script>
        /**
         * GALLERY DATA
         * Modify these arrays to include your actual crew and event media
         */
        const galleryData = {
            'crew55': {
                title: "55 Crew",
                items: [
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/112240/D4AF37?text=Crew+Formation+Photo',
                        caption: 'The whole team standing watch. A memory to last a lifetime.'
                    },
                    {
                        type: 'video',
                        src: 'https://www.w3schools.com/html/mov_bbb.mp4', 
                        caption: 'Farewell message from the Commander.'
                    },
                    {
                        type: 'image',
                        src: 'https://placehold.co/800x1200/112240/D4AF37?text=Autographed+Message+Card',
                        caption: '"Fair winds and following seas" - From the Engineering Department.'
                    }
                ]
            },
            'wildwildwet': {
                title: "Wild Wild Wet Outing",
                items: [
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/0284c7/ffffff?text=Group+Photo+at+Entrance',
                        caption: 'Before the madness began! Team bonding outside the ship.'
                    },
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/0284c7/ffffff?text=Wave+Pool+Fun',
                        caption: 'Taking over the wave pool and enjoying the sun.'
                    },
                    {
                        type: 'video',
                        src: 'https://www.w3schools.com/html/mov_bbb.mp4',
                        caption: 'Racing down the water slides!'
                    }
                ]
            },
            'anniversary': {
                title: "Commissioning Anniversary",
                items: [
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/eeeeee/0A192F?text=Anniversary+Cake',
                        caption: 'Celebrating our first milestone together.'
                    },
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/eeeeee/0A192F?text=Ship+Tour+for+Families',
                        caption: 'Showing our loved ones where we stand our watch.'
                    }
                ]
            }
        };

        // State variables
        let currentGalleryKey = null;
        let currentIndex = 0;

        // DOM Elements
        const modal = document.getElementById('gallery-modal');
        const modalTitle = document.getElementById('modal-title');
        const mediaContainer = document.getElementById('media-container');
        const mediaCaption = document.getElementById('media-caption');
        const mediaIndicators = document.getElementById('media-indicators');

        /**
         * Open the gallery for a specific hotspot
         */
        function openGallery(galleryKey) {
            if (!galleryData[galleryKey]) return;
            
            currentGalleryKey = galleryKey;
            currentIndex = 0; // Start at first item
            
            // Set Text
            modalTitle.textContent = galleryData[currentGalleryKey].title;
            
            // Render first item
            renderCurrentMedia();
            
            // Show modal & prevent body scroll
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        /**
         * Close the gallery
         */
        function closeGallery() {
            modal.classList.remove('active');
            document.body.style.overflow = ''; 
            
            // Wait for fade out transition to finish before clearing container
            setTimeout(() => {
                mediaContainer.innerHTML = '';
                currentGalleryKey = null;
            }, 400);
        }

        /**
         * Render the media at the current index
         */
        function renderCurrentMedia() {
            const gallery = galleryData[currentGalleryKey];
            const item = gallery.items[currentIndex];
            
            // Clear current content
            mediaContainer.innerHTML = '';
            
            // Create Polaroid-style Wrapper
            const polaroidWrapper = document.createElement('div');
            polaroidWrapper.className = 'media-fade bg-white p-3 sm:p-5 shadow-[0_15px_35px_rgba(10,25,47,0.15)] rounded-sm border border-gray-200 flex flex-col items-center justify-center max-w-full max-h-full';
            
            // Create Image Element
            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.caption || 'Gallery Image';
                // object-contain ensures it fits the wrapper, while the wrapper provides the polaroid frame
                img.className = 'max-w-full max-h-full object-contain';
                polaroidWrapper.appendChild(img);
            } 
            // Create Video Element
            else if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.src;
                video.controls = true;
                video.autoplay = true; 
                video.className = 'max-w-full max-h-full object-contain bg-black rounded-sm border border-gray-300';
                polaroidWrapper.appendChild(video);
            }
            
            mediaContainer.appendChild(polaroidWrapper);

            // Update Caption
            mediaCaption.textContent = item.caption || '';
            
            // Update Indicators (Dots)
            updateIndicators(gallery.items.length);
        }

        /**
         * Build and update the pagination dots at the bottom
         */
        function updateIndicators(totalItems) {
            mediaIndicators.innerHTML = ''; // clear existing
            for (let i = 0; i < totalItems; i++) {
                const dot = document.createElement('button');
                // Changed to Navy dots for the light theme
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${i === currentIndex ? 'bg-navy w-8' : 'bg-navy/20 hover:bg-navy/50'}`;
                dot.onclick = () => {
                    currentIndex = i;
                    renderCurrentMedia();
                };
                mediaIndicators.appendChild(dot);
            }
        }

        /**
         * Navigate to Next Item
         */
        function nextMedia() {
            if (!currentGalleryKey) return;
            const gallery = galleryData[currentGalleryKey];
            
            currentIndex++;
            if (currentIndex >= gallery.items.length) {
                currentIndex = 0; // Loop back
            }
            renderCurrentMedia();
        }

        /**
         * Navigate to Previous Item
         */
        function prevMedia() {
            if (!currentGalleryKey) return;
            const gallery = galleryData[currentGalleryKey];
            
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = gallery.items.length - 1; // Loop to end
            }
            renderCurrentMedia();
        }

        /**
         * Event Listeners
         */
        // Close modal when clicking on the dark overlay background outside the content box
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeGallery();
            }
        });

        // Keyboard navigation (Esc to close, Arrows to navigate)
        document.addEventListener('keydown', function(e) {
            if (!modal.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeGallery();
            } else if (e.key === 'ArrowRight') {
                nextMedia();
            } else if (e.key === 'ArrowLeft') {
                prevMedia();
            }
        });
    </script>
</body>
</html>
