<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Stand Our Watch - 55 Crew Scrapbook</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { ink: '#2a2626', sepia: '#e4d5b7', navy: '#1a293b', parchment: '#f4f1ea' },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        handwritten: ['Caveat', 'cursive'],
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #1a1a1a; overflow-x: hidden; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        body.modal-open { overflow: hidden; }

        .hotspot { position: absolute; cursor: pointer; z-index: 10; border-radius: 8px; }
        .hotspot:hover { box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); backdrop-filter: brightness(1.1); }
        .embedded-carousel { position: absolute; z-index: 5; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* HOME SCREEN FIXED MEDIA STYLING */
        .fixed-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; transition: opacity 0.3s ease; }
        .fixed-media { flex: 1; min-height: 0; max-width: 95%; object-fit: contain; mix-blend-mode: multiply; filter: sepia(0.3) contrast(1.1) brightness(0.95); border-radius: 2px; box-shadow: 2px 3px 8px rgba(0,0,0,0.1); }
        .tilt-left { transform: rotate(-1deg); }
        .tilt-right { transform: rotate(1deg); }
        .fixed-caption { flex-shrink: 0; margin-top: 4px; width: 100%; text-align: center; font-family: 'Caveat', cursive; color: #2a2626; line-height: 1.1; font-size: clamp(0.7rem, 1.4vw, 1.4rem); text-shadow: 0px 0px 1px rgba(0,0,0,0.1); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .text-only-message { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding-top: 5%; padding-bottom: 3%; font-family: 'Caveat', cursive; color: #2a2626; text-shadow: 0px 0px 1px rgba(0,0,0,0.1); overflow: hidden; transition: opacity 0.3s ease; cursor: pointer; }
        .message-content-box { width: 95%; flex: 1; min-height: 0; text-align: center; line-height: 1.15; font-size: clamp(0.9rem, 1.5vw, 1.5rem); display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
        .message-author-box { width: 95%; flex-shrink: 0; text-align: right; font-size: clamp(0.8rem, 1.3vw, 1.3rem); font-weight: 600; padding-right: 5%; margin-top: 2%; }

        .carousel-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.4); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #2a2626; opacity: 0; transition: opacity 0.3s ease; z-index: 20; }
        .embedded-carousel:hover .carousel-nav { opacity: 1; }
        .nav-prev { left: 2px; }
        .nav-next { right: 2px; }

        /* CENTER CREW MORPHING VIDEO STYLING */
        #center-video-container { position: absolute; z-index: 15; top: 12%; left: 32%; width: 35%; height: 75%; overflow: hidden; border-radius: 4px; pointer-events: none; }
        #center-video { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; opacity: 0; transition: opacity 1s ease-in-out; mix-blend-mode: multiply; filter: sepia(0.3) contrast(1.1) brightness(0.95); }
        #center-video.active { opacity: 1; }

        .modal-overlay { opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .loading-text { font-family: 'Caveat', cursive; color: #2a2626; font-size: clamp(1rem, 1.5vw, 1.5rem); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* VINTAGE SCROLLBAR FOR ALBUM MENU & MODALS */
        .album-scrollbar::-webkit-scrollbar { width: 4px; }
        .album-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .album-scrollbar::-webkit-scrollbar-thumb { background: rgba(42, 38, 38, 0.2); border-radius: 2px; }
        
        .vintage-media-layer { mix-blend-mode: multiply; filter: sepia(0.2) contrast(1.05) brightness(0.98); border-radius: 2px; }
    </style>
</head>
<body class="p-2 sm:p-8">

    <main id="mainframe" class="relative w-full max-w-[1400px] mx-auto shadow-2xl overflow-hidden rounded-sm bg-[#e4d5b7]">
        <img src="55%20Frame.jpg" alt="Scrapbook Ship Photo Frame" class="w-full h-auto block rounded-sm shadow-[0_0_50px_rgba(0,0,0,0.8)]">

        <!-- Left Side Informational Hotspots -->
        <div class="hotspot" style="top: 13%; left: 5%; width: 22%; height: 13%;" onclick="openInfoModal('story')" title="Read Our Story"></div>
        <div class="hotspot" style="top: 38%; left: 6%; width: 22%; height: 21%;" onclick="openInfoModal('awards')" title="View Our Awards"></div>
        <div class="hotspot" style="top: 71%; left: 5%; width: 25%; height: 16%;" onclick="openInfoModal('crew')" title="Meet Our Crew"></div>
        
        <!-- Right Side Header Hotspots -->
        <div class="hotspot" style="top: 13.5%; left: 70%; width: 25%; height: 8.5%;" onclick="openScrapbookModal('moments')" title="View All Moments"></div>
        <div class="hotspot" style="top: 55.5%; left: 70%; width: 25%; height: 8%;" onclick="openScrapbookModal('messages')" title="View All Messages"></div>

        <!-- CENTER CREW MORPHING VIDEO -->
        <div id="center-video-container">
            <video id="center-video" src="Sen%20WS.mp4" playsinline preload="metadata"></video>
        </div>
        <div class="hotspot" style="top: 12%; left: 32%; width: 35%; height: 75%; z-index: 16;" onclick="toggleCenterVideo()" title="Bring Crew to Life"></div>

        <!-- Carousels -->
        <div id="moments-carousel" class="embedded-carousel" style="top: 24%; left: 71.5%; width: 22%; height: 23%;">
            <div class="carousel-nav nav-prev" onclick="changeMoment(-1)"><i class="fa-solid fa-chevron-left text-xs"></i></div>
            <div class="carousel-nav nav-next" onclick="changeMoment(1)"><i class="fa-solid fa-chevron-right text-xs"></i></div>
            <div id="moments-content" class="w-full h-full flex items-center justify-center">
                <div class="loading-text">Loading...</div>
            </div>
        </div>

        <div id="messages-carousel" class="embedded-carousel" style="top: 64%; left: 71.5%; width: 22%; height: 23.5%;">
            <div class="carousel-nav nav-prev" onclick="changeMessage(-1)"><i class="fa-solid fa-chevron-left text-xs"></i></div>
            <div class="carousel-nav nav-next" onclick="changeMessage(1)"><i class="fa-solid fa-chevron-right text-xs"></i></div>
            <div id="messages-content" class="w-full h-full flex items-center justify-center">
                <div class="loading-text">Syncing DB...</div>
            </div>
        </div>

        <!-- 1. STANDARD INFO MODAL -->
        <div id="info-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-2 sm:p-6">
            <div id="info-content-wrapper" class="bg-parchment border border-ink/20 rounded-[2px] shadow-[0_0_40px_rgba(0,0,0,0.6)] w-[95%] max-w-4xl h-[80vh] sm:h-[85vh] flex flex-col relative overflow-hidden origin-center">
                <header class="flex justify-between items-center p-4 sm:p-6 border-b border-ink/10 bg-[#fbf8f1] shrink-0">
                    <div class="flex flex-col">
                        <p class="text-ink/60 text-[10px] sm:text-xs tracking-[0.3em] font-sans font-medium uppercase mb-1">We Stand Our Watch</p>
                        <h2 id="info-modal-title" class="font-serif text-xl sm:text-3xl font-bold text-ink m-0">Title</h2>
                    </div>
                    <button onclick="closeModals()" class="text-ink/50 hover:text-ink hover:bg-ink/5 transition-colors w-10 h-10 flex justify-center items-center rounded-full text-xl focus:outline-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </header>
                <div id="info-modal-body" class="flex-1 overflow-y-auto p-4 sm:p-8 bg-parchment text-ink font-serif text-lg leading-relaxed"></div>
            </div>
        </div>

        <!-- 2. CLEAN ASSET SCAPBOOK MODAL (Mapped Geometrically) -->
        <div id="scrapbook-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-2 sm:p-4 md:p-8">
            <!-- Constrained to a strict 1.6:1 aspect ratio to perfectly map the book shape -->
            <div id="scrapbook-content-wrapper" class="flex flex-row w-full max-w-6xl max-h-[90vh] origin-center relative overflow-hidden bg-center bg-no-repeat bg-[length:100%_100%] drop-shadow-[0_0_50px_rgba(0,0,0,0.9)]" style="aspect-ratio: 1.6 / 1; background-image: url('popup-bg.png');">
                
                <!-- X Close Button placed correctly on the top right edge of the paper -->
                <button onclick="closeModals()" class="absolute top-[6%] right-[8%] text-ink/60 hover:text-ink transition-colors w-10 h-10 flex justify-center items-center text-4xl font-handwritten z-50 focus:outline-none">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <!-- Left Page (Menu) -->
                <!-- Uses strict percentage padding to avoid the torn edge -->
                <div class="w-1/2 h-full flex flex-col pt-[12%] pb-[8%] pl-[16%] pr-[6%] z-10 overflow-hidden">
                    <h2 id="sidebar-title" class="font-handwritten text-4xl md:text-5xl lg:text-6xl text-ink text-left mb-4 md:mb-8 drop-shadow-sm">ALBUMS</h2>
                    <div id="album-list" class="flex flex-col gap-2 md:gap-4 overflow-y-auto album-scrollbar items-start w-full">
                        <!-- Menu items injected here -->
                    </div>
                </div>

                <!-- Right Page (Grid) -->
                <!-- Strict percentage padding to perfectly overlay the graph paper -->
                <div class="w-1/2 h-full relative flex flex-col pt-[10%] pb-[8%] pr-[16%] pl-[6%] z-10">
                    
                    <div class="flex flex-col pb-2 md:pb-4 border-b border-ink/10 mb-2 md:mb-4">
                        <h2 id="scrapbook-title" class="font-handwritten text-3xl md:text-5xl text-ink m-0 leading-none">All Our Moments</h2>
                        <p class="text-ink/60 text-[8px] md:text-[10px] tracking-[0.2em] font-sans font-medium uppercase mt-2">We Stand Our Watch</p>
                    </div>
                    
                    <div class="flex-1 relative flex items-center justify-center overflow-hidden">
                        <button onclick="changeAlbumPage(-1)" id="album-prev-btn" class="absolute left-0 z-20 text-3xl md:text-4xl text-ink/40 hover:text-ink/90 transition-colors focus:outline-none"><i class="fa-solid fa-chevron-left"></i></button>
                        
                        <!-- 2x2 Grid with constrained image boxes -->
                        <div id="scrapbook-grid" class="grid grid-cols-2 gap-4 md:gap-6 w-full h-full max-h-full overflow-y-auto album-scrollbar items-start content-start px-8">
                            <!-- Clean images and text injected here -->
                        </div>
                        
                        <button onclick="changeAlbumPage(1)" id="album-next-btn" class="absolute right-0 z-20 text-3xl md:text-4xl text-ink/40 hover:text-ink/90 transition-colors focus:outline-none"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    
                    <div class="text-right font-handwritten text-lg md:text-2xl text-ink/70 mt-2" id="album-pagination-text">Page 1 of 1</div>
                </div>
            </div>
        </div>

        <!-- 3. EXPANDED MEDIA LIGHTBOX (NEW) -->
        <!-- Opens when you click an image in the scrapbook grid -->
        <div id="expanded-media-modal" class="modal-overlay fixed inset-0 z-[60] flex flex-col items-center justify-center bg-black/95 p-4 md:p-8" onclick="closeExpandedMedia(event)">
            <button class="absolute top-4 right-4 md:top-8 md:right-8 text-white/50 hover:text-white transition-colors w-12 h-12 flex justify-center items-center text-4xl focus:outline-none">
                <i class="fa-solid fa-xmark pointer-events-none"></i>
            </button>
            <div id="expanded-media-container" class="w-full max-w-6xl max-h-[85vh] flex justify-center items-center shadow-[0_0_50px_rgba(0,0,0,0.8)]">
                <!-- High-res photo/video injected here -->
            </div>
            <p id="expanded-media-caption" class="text-white/80 font-handwritten text-2xl md:text-4xl mt-6 text-center max-w-4xl tracking-wide"></p>
        </div>

    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygvkuti5gfBd4C3lk66ROyIEOCA86Tk6V7BvcAqVLZvyz2G1bWDNJyQQWjFZ9IuNWO/exec"; 

        const centerVideo = document.getElementById('center-video');
        function toggleCenterVideo() {
            if (centerVideo.paused) {
                centerVideo.play();
                centerVideo.classList.add('active'); 
            } else {
                centerVideo.classList.remove('active'); 
                setTimeout(() => { if (!centerVideo.classList.contains('active')) centerVideo.pause(); }, 1000);
            }
        }
        centerVideo.addEventListener('ended', () => centerVideo.classList.remove('active'));

        const infoModalData = {
            'story': {
                title: "Our Story",
                content: `<p class="mb-4">From our very first commissioning to our final patrol, the 55 Crew has weathered every storm together. We stood our watch through countless days and nights, forging an unbreakable bond.</p>
                          <img src="https://placehold.co/800x400/2a2626/f4f1ea?text=Historical+Ship+Photo" class="w-full h-auto rounded shadow-md border border-ink/20 mb-4" alt="Historical photo">
                          <p>This ship was more than steel and engines; it was our home away from home.</p>`
            },
            'awards': {
                title: "Our Awards",
                content: `<ul class="list-disc pl-6 space-y-4">
                            <li><strong>Best Fleet Unit (2023)</strong> - Recognized for outstanding operational readiness.</li>
                            <li><strong>Excellence in Navigation</strong> - For zero safety incidents during our longest deployment.</li>
                            <li><strong>Commendation of Service</strong> - Awarded during the joint regional maritime exercises.</li>
                          </ul>`
            },
            'crew': {
                title: "Meet Our Crew",
                content: `<p class="mb-4">The heart of this vessel is the men and women who served aboard her.</p>
                          <img src="https://placehold.co/800x500/2a2626/f4f1ea?text=Full+Crew+Roster" class="w-full h-auto rounded shadow-md border border-ink/20" alt="Crew roster">`
            }
        };

        let momentsData = [];
        let messagesData = [];
        let currentMoment = 0;
        let currentMessage = 0;

        async function fetchScrapbookData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const rawData = await response.json();
                
                rawData.forEach(row => {
                    const category = row.Category ? row.Category.toLowerCase().trim() : '';
                    const type = row.Media_Type ? row.Media_Type.toLowerCase().trim() : 'text';
                    
                    if (category === 'moments') {
                        momentsData.push({ type: type, src: row.Media_URL, caption: row.Content, author: row.Author_or_Title });
                    } else if (category === 'messages') {
                        messagesData.push({ type: type, src: row.Media_URL, content: row.Content, author: row.Author_or_Title });
                    }
                });

                if (momentsData.length === 0) momentsData = [{type: 'text', caption: 'No moments added yet!', author: 'System'}];
                if (messagesData.length === 0) messagesData = [{type: 'text', content: 'No messages added yet!', author: 'System'}];

                renderMoment();
                renderMessage();

            } catch (error) {
                console.error("Database connection failed:", error);
                document.getElementById('moments-content').innerHTML = '<div class="text-only-message tilt-left text-sm">Failed to connect to Google Sheet.</div>';
                document.getElementById('messages-content').innerHTML = '<div class="text-only-message tilt-right text-sm">Failed to connect to Google Sheet.</div>';
            }
        }
        window.onload = fetchScrapbookData;

        // ----------------------------------------------------
        // Home Screen Carousel Rendering
        // ----------------------------------------------------
        function renderMoment() {
            if(momentsData.length === 0) return;
            const container = document.getElementById('moments-content');
            const data = momentsData[currentMoment];
            
            container.style.opacity = 0;
            setTimeout(() => {
                if (data.type === 'text') {
                    container.innerHTML = `<div class="text-only-message tilt-left"><div class="message-content-box">${data.caption}</div></div>`;
                } else {
                    let mediaHtml = data.type === 'video' 
                        ? `<video src="${data.src}" class="fixed-media tilt-left" autoplay loop muted playsinline></video>`
                        : `<img src="${data.src}" class="fixed-media tilt-left" alt="Crew Moment">`;
                    let captionHtml = data.caption ? `<div class="fixed-caption tilt-left">${data.caption}</div>` : '';
                    container.innerHTML = `<div class="fixed-wrapper">${mediaHtml}${captionHtml}</div>`;
                }
                container.style.opacity = 1;
            }, 150); 
        }

        function renderMessage() {
            if(messagesData.length === 0) return;
            const container = document.getElementById('messages-content');
            const data = messagesData[currentMessage];
            
            container.style.opacity = 0;
            setTimeout(() => {
                if (data.type === 'text') {
                    container.innerHTML = `
                        <div class="text-only-message tilt-right" id="current-message-box" onclick="openScrapbookModal('messages')" title="Click to read full messages">
                            <div class="message-content-box" id="msg-content">${data.content}</div>
                            <div class="message-author-box" id="msg-author"></div>
                        </div>
                    `;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const contentBox = document.getElementById('msg-content');
                            const authorBox = document.getElementById('msg-author');
                            contentBox.style.webkitLineClamp = 'unset';
                            authorBox.innerHTML = `- ${data.author || 'Crew'}`;
                            
                            if (contentBox.scrollHeight > contentBox.clientHeight) {
                                let lines = 25; 
                                contentBox.style.webkitLineClamp = lines;
                                while (contentBox.scrollHeight > contentBox.clientHeight && lines > 1) {
                                    lines--;
                                    contentBox.style.webkitLineClamp = lines;
                                }
                                authorBox.innerHTML = `... - ${data.author || 'Crew'}`;
                            }
                            container.style.opacity = 1;
                        });
                    });
                } else {
                    let mediaHtml = data.type === 'video' 
                        ? `<video src="${data.src}" class="fixed-media tilt-right" autoplay loop muted playsinline></video>`
                        : `<img src="${data.src}" class="fixed-media tilt-right" alt="Crew Message">`;
                    let captionHtml = data.caption ? `<div class="fixed-caption tilt-right">${data.caption}</div>` : '';
                    container.innerHTML = `<div class="fixed-wrapper">${mediaHtml}${captionHtml}</div>`;
                    container.style.opacity = 1;
                }
            }, 150);
        }

        function changeMoment(dir) {
            currentMoment += dir;
            if (currentMoment >= momentsData.length) currentMoment = 0;
            if (currentMoment < 0) currentMoment = momentsData.length - 1;
            renderMoment();
        }

        function changeMessage(dir) {
            currentMessage += dir;
            if (currentMessage >= messagesData.length) currentMessage = 0;
            if (currentMessage < 0) currentMessage = messagesData.length - 1;
            renderMessage();
        }

        // ----------------------------------------------------
        // CLEAN ASSET SCAPBOOK GALLERY
        // ----------------------------------------------------
        let scrapbookType = ''; 
        let scrapbookAlbums = [];
        let activeAlbum = '';
        let albumPage = 1;
        const ITEMS_PER_PAGE = 4; // 2x2 grid layout

        function openScrapbookModal(type) {
            scrapbookType = type;
            let dataset = type === 'moments' ? momentsData : messagesData;
            
            document.getElementById('sidebar-title').innerText = type === 'moments' ? 'ALBUMS' : 'AUTHORS';
            document.getElementById('scrapbook-title').innerText = type === 'moments' ? 'All Our Moments' : 'All Our Messages';

            scrapbookAlbums = [...new Set(dataset.map(item => item.author || (type === 'moments' ? 'General' : 'Crew')))];
            
            if(scrapbookAlbums.length > 0) activeAlbum = scrapbookAlbums[0];
            albumPage = 1;

            document.body.classList.add('modal-open');
            document.getElementById('scrapbook-modal').classList.add('active');
            
            if (window.visualViewport) syncVisualViewport('scrapbook-content-wrapper');
            if (!centerVideo.paused) { centerVideo.pause(); centerVideo.classList.remove('active'); }

            renderScrapbookContent();
        }

        function renderScrapbookContent() {
            let dataset = scrapbookType === 'moments' ? momentsData : messagesData;
            let filteredData = dataset.filter(item => (item.author || (scrapbookType === 'moments' ? 'General' : 'Crew')) === activeAlbum);
            
            let totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE) || 1;
            if (albumPage > totalPages) albumPage = totalPages;
            if (albumPage < 1) albumPage = 1;

            // 1. RENDER LEFT MENU
            let albumHtml = '';
            scrapbookAlbums.forEach(album => {
                let isActive = album === activeAlbum;
                albumHtml += `
                    <div onclick="selectAlbum('${album.replace(/'/g, "\\'")}')" class="w-full cursor-pointer transition-all duration-200 py-1 md:py-2 ${isActive ? 'translate-x-2' : 'hover:translate-x-1'}">
                        <span class="font-handwritten text-2xl md:text-4xl text-ink ${isActive ? 'font-bold border-b-2 border-ink/40' : 'opacity-70'}">${album}</span>
                    </div>
                `;
            });
            document.getElementById('album-list').innerHTML = albumHtml;

            // 2. RENDER RIGHT GRID
            let gridHtml = '';
            let startIdx = (albumPage - 1) * ITEMS_PER_PAGE;
            let pageData = filteredData.slice(startIdx, startIdx + ITEMS_PER_PAGE);
            
            pageData.forEach((item, idx) => {
                let tilt = idx % 2 === 0 ? 'rotate-1' : '-rotate-1';
                
                if (item.type === 'text') {
                    gridHtml += `
                        <div class="flex flex-col items-center justify-center p-2 min-h-[120px] ${tilt}">
                            <p class="font-handwritten text-lg md:text-2xl text-ink text-center leading-tight">"${item.content}"</p>
                        </div>
                    `;
                } else {
                    // Safe string escaping for the onclick function
                    let safeSrc = item.src.replace(/'/g, "\\'");
                    let safeCaption = (item.caption || '').replace(/'/g, "\\'");
                    
                    let media = item.type === 'video' 
                        ? `<div class="w-full aspect-[4/3] flex items-center justify-center overflow-hidden bg-black/5 rounded-[2px] shadow-sm relative group">
                             <video src="${item.src}" class="max-w-full max-h-full object-contain vintage-media-layer"></video>
                             <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-play text-white text-3xl md:text-4xl"></i></div>
                           </div>`
                        : `<div class="w-full aspect-[4/3] flex items-center justify-center overflow-hidden bg-black/5 rounded-[2px] shadow-sm relative group">
                             <img src="${item.src}" class="max-w-full max-h-full object-contain vintage-media-layer drop-shadow-sm" alt="Media">
                             <div class="absolute inset-0 bg-white/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-magnifying-glass text-ink/80 text-3xl md:text-4xl"></i></div>
                           </div>`;
                    
                    // Added Expandable click trigger
                    gridHtml += `
                        <div class="w-full flex flex-col items-center ${tilt} transition-transform hover:scale-[1.03] duration-300 cursor-pointer" onclick="expandMedia('${safeSrc}', '${item.type}', '${safeCaption}')">
                            ${media}
                            <div class="w-full flex flex-col items-center mt-2 px-1">
                                <p class="font-handwritten text-base md:text-xl text-ink text-center leading-tight line-clamp-2" title="${item.caption || ''}">${item.caption || ''}</p>
                            </div>
                        </div>
                    `;
                }
            });
            document.getElementById('scrapbook-grid').innerHTML = gridHtml;

            // 3. PAGINATION
            document.getElementById('album-pagination-text').innerText = `Page ${albumPage} of ${totalPages}`;
            document.getElementById('album-prev-btn').style.display = albumPage > 1 ? 'block' : 'none';
            document.getElementById('album-next-btn').style.display = albumPage < totalPages ? 'block' : 'none';
        }

        function selectAlbum(album) {
            activeAlbum = album;
            albumPage = 1;
            renderScrapbookContent();
        }

        function changeAlbumPage(dir) {
            albumPage += dir;
            renderScrapbookContent();
        }

        // ----------------------------------------------------
        // Expandable Media Lightbox
        // ----------------------------------------------------
        function expandMedia(src, type, caption) {
            const container = document.getElementById('expanded-media-container');
            const captionBox = document.getElementById('expanded-media-caption');
            
            if (type === 'video') {
                container.innerHTML = `<video src="${src}" controls autoplay class="w-auto h-auto max-w-full max-h-[85vh] object-contain rounded drop-shadow-2xl border-2 border-white/10"></video>`;
            } else {
                container.innerHTML = `<img src="${src}" class="w-auto h-auto max-w-full max-h-[85vh] object-contain rounded drop-shadow-2xl border-2 border-white/10">`;
            }
            
            captionBox.innerText = caption || '';
            document.getElementById('expanded-media-modal').classList.add('active');
        }

        function closeExpandedMedia(e) {
            // Only close if clicking the background or the X button
            if (e.target.tagName.toLowerCase() === 'img' || e.target.tagName.toLowerCase() === 'video') return;
            
            document.getElementById('expanded-media-modal').classList.remove('active');
            const vids = document.querySelectorAll('#expanded-media-container video');
            vids.forEach(v => v.pause());
            
            setTimeout(() => { document.getElementById('expanded-media-container').innerHTML = ''; }, 300);
        }

        // ----------------------------------------------------
        // Generic Modal Management
        // ----------------------------------------------------
        const infoModal = document.getElementById('info-modal');
        const scrapbookModal = document.getElementById('scrapbook-modal');

        function openInfoModal(key) {
            const data = infoModalData[key];
            if (!data) return;
            document.getElementById('info-modal-title').innerText = data.title;
            document.getElementById('info-modal-body').innerHTML = data.content || '<p class="italic text-ink/60">No content added yet.</p>';
            document.body.classList.add('modal-open');
            infoModal.classList.add('active');
            if (window.visualViewport) syncVisualViewport('info-content-wrapper');
            if (!centerVideo.paused) { centerVideo.pause(); centerVideo.classList.remove('active'); }
        }

        function syncVisualViewport(wrapperId) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper || !window.visualViewport) return;
            const scale = window.visualViewport.scale;
            const tx = (window.visualViewport.offsetLeft + (window.visualViewport.width / 2)) - (window.innerWidth / 2);
            const ty = (window.visualViewport.offsetTop + (window.visualViewport.height / 2)) - (window.innerHeight / 2);
            wrapper.style.transform = `translate(${tx}px, ${ty}px) scale(${1 / scale})`;
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                if(infoModal.classList.contains('active')) syncVisualViewport('info-content-wrapper');
                if(scrapbookModal.classList.contains('active')) syncVisualViewport('scrapbook-content-wrapper');
            });
            window.visualViewport.addEventListener('scroll', () => {
                if(infoModal.classList.contains('active')) syncVisualViewport('info-content-wrapper');
                if(scrapbookModal.classList.contains('active')) syncVisualViewport('scrapbook-content-wrapper');
            });
        }

        function closeModals() {
            document.body.classList.remove('modal-open');
            
            infoModal.classList.remove('active');
            document.getElementById('info-content-wrapper').style.transform = 'translate(0, 0) scale(1)';
            
            scrapbookModal.classList.remove('active');
            document.getElementById('scrapbook-content-wrapper').style.transform = 'translate(0, 0) scale(1)';
            
            const videos = document.querySelectorAll('.modal-overlay video');
            videos.forEach(vid => vid.pause());
            
            setTimeout(() => { document.getElementById('info-modal-body').innerHTML = ''; }, 300);
        }

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            // Avoid closing if it's the expanded media modal (handled separately)
            if(modal.id !== 'expanded-media-modal') {
                modal.addEventListener('click', function(e) { if (e.target === this) closeModals(); });
            }
        });
        
        document.addEventListener('keydown', function(e) { 
            if (e.key === 'Escape') {
                if (document.getElementById('expanded-media-modal').classList.contains('active')) {
                    closeExpandedMedia({target: document.getElementById('expanded-media-modal')});
                } else if (infoModal.classList.contains('active') || scrapbookModal.classList.contains('active')) {
                    closeModals(); 
                }
            }
        });
    </script>
</body>
</html>
