<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Stand Our Watch - Interactive Frame</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Playfair Display for elegant maritime theme -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0A192F',
                        navy_light: '#112240',
                        gold: '#D4AF37',
                        gold_light: '#F3E5AB',
                        parchment: '#f4f1ea' 
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050b14; 
            font-family: 'Inter', sans-serif;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            border-radius: 8px;
            z-index: 10;
        }

        .hotspot:hover {
            background-color: rgba(212, 175, 55, 0.15); 
            border-color: rgba(212, 175, 55, 0.8); 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .hotspot::after {
            content: attr(data-label);
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(244, 241, 234, 0.95); 
            color: #0A192F; 
            padding: 8px 16px;
            border: 1px solid #0A192F; 
            border-radius: 4px;
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .hotspot:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .media-fade {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0A192F; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- MAIN DISPLAY CONTAINER -->
    <main id="mainframe" class="relative w-full max-w-[1400px] mx-auto shadow-2xl overflow-hidden rounded-sm">
        
        <img src="Gemini_Generated_Image_nnra02nnra02nnra.jpg" 
             alt="Commemorative Ship Photo Frame" 
             class="w-full h-auto block rounded-sm shadow-[0_0_50px_rgba(0,0,0,0.8)]">

        <div class="hotspot" 
             style="top: 12%; left: 30%; width: 40%; height: 74%;" 
             data-label="View 55 Crew Memories"
             onclick="openGallery('crew55')"
             title="Click to view 55 Crew memories">
        </div>

        <div class="hotspot" 
             style="top: 70%; left: 5%; width: 33%; height: 21%;" 
             data-label="View Wild Wild Wet Gallery"
             onclick="openGallery('wildwildwet')"
             title="Click to view Wild Wild Wet memories">
        </div>

        <div class="hotspot" 
             style="top: 15%; left: 75%; width: 20%; height: 18%;" 
             data-label="Commissioning Anniversary"
             onclick="openGallery('anniversary')"
             title="Click to view Commissioning Anniversary">
        </div>

        <!-- MODAL / LIGHTBOX -->
        <!-- Moved INSIDE the mainframe! It uses 'absolute inset-0' to perfectly overlay the image. -->
        <!-- Changed to a very light bg-navy/20 to drastically increase mainframe visibility -->
        <div id="gallery-modal" class="modal-overlay absolute inset-0 z-50 flex items-center justify-center bg-navy/20 p-2 sm:p-6">
            
            <!-- Modal Content Container -->
            <!-- Sized to exactly 95% of the mainframe width and height, guaranteeing it is never bigger than the frame -->
            <div class="bg-parchment border border-navy/30 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.4)] w-[95%] h-[95%] flex flex-col relative overflow-hidden">
                
                <header class="flex justify-between items-center p-4 sm:p-6 border-b border-navy/10 bg-white/40 shrink-0">
                    <div class="flex flex-col">
                        <p class="text-navy/70 text-[10px] sm:text-xs tracking-[0.3em] font-sans font-medium uppercase mb-1">
                            We Stand Our Watch
                        </p>
                        <h2 id="modal-title" class="font-serif text-xl sm:text-3xl font-bold text-navy m-0 drop-shadow-sm">
                            Gallery Title
                        </h2>
                    </div>
                    
                    <button onclick="closeGallery()" class="text-navy/60 hover:text-navy hover:bg-navy/10 transition-colors w-10 h-10 flex justify-center items-center rounded-full text-xl focus:outline-none" title="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </header>

                <div class="flex-1 relative flex items-center justify-center bg-transparent overflow-hidden group">
                    
                    <button onclick="prevMedia()" class="absolute left-2 sm:left-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-white/90 border border-navy/20 text-navy hover:bg-navy hover:text-white transition-all text-lg opacity-0 group-hover:opacity-100 focus:opacity-100 focus:outline-none shadow-md">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <div id="media-container" class="w-full h-full flex items-center justify-center p-3 sm:p-6 relative z-10">
                        <!-- Image or Video injected here by JS -->
                    </div>

                    <button onclick="nextMedia()" class="absolute right-2 sm:right-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-white/90 border border-navy/20 text-navy hover:bg-navy hover:text-white transition-all text-lg opacity-0 group-hover:opacity-100 focus:opacity-100 focus:outline-none shadow-md">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <footer class="p-3 sm:p-5 border-t border-navy/10 bg-white/40 shrink-0 text-center flex flex-col items-center justify-center">
                    <p id="media-caption" class="text-navy font-sans text-sm sm:text-base min-h-[1.5rem] max-w-3xl mx-auto font-medium">
                        <!-- Caption injected via JS -->
                    </p>
                    <div id="media-indicators" class="flex gap-2 mt-3">
                        <!-- Dots injected via JS -->
                    </div>
                </footer>
            </div>
        </div>
    </main>

    <script>
        const galleryData = {
            'crew55': {
                title: "55 Crew",
                items: [
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/112240/D4AF37?text=Crew+Formation+Photo',
                        caption: 'The whole team standing watch. A memory to last a lifetime.'
                    },
                    {
                        type: 'video',
                        src: 'https://www.w3schools.com/html/mov_bbb.mp4', 
                        caption: 'Farewell message from the Commander.'
                    },
                    {
                        type: 'image',
                        src: 'https://placehold.co/800x1200/112240/D4AF37?text=Autographed+Message+Card',
                        caption: '"Fair winds and following seas" - From the Engineering Department.'
                    }
                ]
            },
            'wildwildwet': {
                title: "Wild Wild Wet Outing",
                items: [
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/0284c7/ffffff?text=Group+Photo+at+Entrance',
                        caption: 'Before the madness began! Team bonding outside the ship.'
                    },
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/0284c7/ffffff?text=Wave+Pool+Fun',
                        caption: 'Taking over the wave pool and enjoying the sun.'
                    },
                    {
                        type: 'video',
                        src: 'https://www.w3schools.com/html/mov_bbb.mp4',
                        caption: 'Racing down the water slides!'
                    }
                ]
            },
            'anniversary': {
                title: "Commissioning Anniversary",
                items: [
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/eeeeee/0A192F?text=Anniversary+Cake',
                        caption: 'Celebrating our first milestone together.'
                    },
                    {
                        type: 'image',
                        src: 'https://placehold.co/1200x800/eeeeee/0A192F?text=Ship+Tour+for+Families',
                        caption: 'Showing our loved ones where we stand our watch.'
                    }
                ]
            }
        };

        let currentGalleryKey = null;
        let currentIndex = 0;

        const modal = document.getElementById('gallery-modal');
        const modalTitle = document.getElementById('modal-title');
        const mediaContainer = document.getElementById('media-container');
        const mediaCaption = document.getElementById('media-caption');
        const mediaIndicators = document.getElementById('media-indicators');

        function openGallery(galleryKey) {
            if (!galleryData[galleryKey]) return;
            
            currentGalleryKey = galleryKey;
            currentIndex = 0; 
            
            modalTitle.textContent = galleryData[currentGalleryKey].title;
            
            renderCurrentMedia();
            
            modal.classList.add('active');
            
            // Auto-centers the mainframe on the screen when a hotspot is clicked 
            // ensuring the modal is squarely in view
            document.getElementById('mainframe').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function closeGallery() {
            modal.classList.remove('active');
            
            setTimeout(() => {
                mediaContainer.innerHTML = '';
                currentGalleryKey = null;
            }, 400);
        }

        function renderCurrentMedia() {
            const gallery = galleryData[currentGalleryKey];
            const item = gallery.items[currentIndex];
            
            mediaContainer.innerHTML = '';
            
            const polaroidWrapper = document.createElement('div');
            polaroidWrapper.className = 'media-fade bg-white p-2 sm:p-4 shadow-[0_15px_35px_rgba(10,25,47,0.15)] rounded-sm border border-gray-200 flex flex-col items-center justify-center max-w-full max-h-full';
            
            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.caption || 'Gallery Image';
                img.className = 'max-w-full max-h-full object-contain';
                polaroidWrapper.appendChild(img);
            } 
            else if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.src;
                video.controls = true;
                video.autoplay = true; 
                video.className = 'max-w-full max-h-full object-contain bg-black rounded-sm border border-gray-300';
                polaroidWrapper.appendChild(video);
            }
            
            mediaContainer.appendChild(polaroidWrapper);
            mediaCaption.textContent = item.caption || '';
            updateIndicators(gallery.items.length);
        }

        function updateIndicators(totalItems) {
            mediaIndicators.innerHTML = ''; 
            for (let i = 0; i < totalItems; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${i === currentIndex ? 'bg-navy w-6' : 'bg-navy/20 hover:bg-navy/50'}`;
                dot.onclick = () => {
                    currentIndex = i;
                    renderCurrentMedia();
                };
                mediaIndicators.appendChild(dot);
            }
        }

        function nextMedia() {
            if (!currentGalleryKey) return;
            const gallery = galleryData[currentGalleryKey];
            
            currentIndex++;
            if (currentIndex >= gallery.items.length) {
                currentIndex = 0; 
            }
            renderCurrentMedia();
        }

        function prevMedia() {
            if (!currentGalleryKey) return;
            const gallery = galleryData[currentGalleryKey];
            
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = gallery.items.length - 1; 
            }
            renderCurrentMedia();
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeGallery();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (!modal.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeGallery();
            } else if (e.key === 'ArrowRight') {
                nextMedia();
            } else if (e.key === 'ArrowLeft') {
                prevMedia();
            }
        });
    </script>
</body>
</html>
