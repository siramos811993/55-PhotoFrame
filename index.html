<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Stand Our Watch - 55 Crew Scrapbook</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Playfair Display & Caveat (for handwritten notes) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#2a2626',      
                        sepia: '#e4d5b7',    
                        navy: '#1a293b',     
                        parchment: '#f4f1ea' 
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        handwritten: ['Caveat', 'cursive'],
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #1a1a1a; 
            overflow-x: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        body.modal-open {
            overflow: hidden;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            border-radius: 8px;
        }

        .hotspot:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: brightness(1.1);
        }

        .embedded-carousel {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .moment-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 2%; 
            transition: opacity 0.3s ease;
        }

        .moment-media {
            max-width: 90%;
            max-height: 75%; 
            object-fit: contain; 
            mix-blend-mode: multiply;
            filter: sepia(0.3) contrast(1.1) brightness(0.95); 
            border-radius: 2px;
            transform: rotate(-1deg); 
            box-shadow: 2px 3px 8px rgba(0,0,0,0.1);
        }

        .moment-caption {
            font-family: 'Caveat', cursive;
            color: #2a2626;
            text-align: center;
            line-height: 1.1;
            width: 95%;
            margin-top: 6px;
            transform: rotate(-1deg);
            text-shadow: 0px 0px 1px rgba(0,0,0,0.1);
            
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .message-note {
            font-family: 'Caveat', cursive;
            color: #2a2626;
            text-align: center;
            line-height: 1.1;
            width: 95%;
            transform: rotate(1deg);
            transition: opacity 0.3s ease;
            text-shadow: 0px 0px 1px rgba(0,0,0,0.1);
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2a2626;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        .embedded-carousel:hover .carousel-nav {
            opacity: 1;
        }
        .nav-prev { left: 2px; }
        .nav-next { right: 2px; }

        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="p-2 sm:p-8">

    <main id="mainframe" class="relative w-full max-w-[1400px] mx-auto shadow-2xl overflow-hidden rounded-sm bg-[#e4d5b7]">
        
        <img src="55%20Frame.jpg" 
             alt="Scrapbook Ship Photo Frame" 
             class="w-full h-auto block rounded-sm shadow-[0_0_50px_rgba(0,0,0,0.8)]">

        <div class="hotspot" style="top: 13%; left: 5%; width: 22%; height: 13%;" onclick="openModal('story')"></div>
        <div class="hotspot" style="top: 38%; left: 6%; width: 22%; height: 21%;" onclick="openModal('awards')"></div>
        <div class="hotspot" style="top: 71%; left: 5%; width: 25%; height: 16%;" onclick="openModal('crew')"></div>

        <!-- 
          Moments Container tightly constrained:
          Height reduced to 23.5% and top shifted to 23% to physically stop rendering before the tape.
        -->
        <div id="moments-carousel" class="embedded-carousel" style="top: 23%; left: 71.5%; width: 22%; height: 23.5%;">
            <div class="carousel-nav nav-prev" onclick="changeMoment(-1)"><i class="fa-solid fa-chevron-left text-xs"></i></div>
            <div class="carousel-nav nav-next" onclick="changeMoment(1)"><i class="fa-solid fa-chevron-right text-xs"></i></div>
            <div id="moments-content" class="w-full h-full flex items-center justify-center"></div>
        </div>

        <div id="messages-carousel" class="embedded-carousel" style="top: 64%; left: 71.5%; width: 22%; height: 21%;">
            <div class="carousel-nav nav-prev" onclick="changeMessage(-1)"><i class="fa-solid fa-chevron-left text-xs"></i></div>
            <div class="carousel-nav nav-next" onclick="changeMessage(1)"><i class="fa-solid fa-chevron-right text-xs"></i></div>
            <div id="messages-content" class="w-full h-full flex items-start justify-center pt-1 sm:pt-2"></div>
        </div>

        <div id="gallery-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-2 sm:p-6">
            <div id="modal-content-wrapper" class="bg-parchment border border-ink/20 rounded-[2px] shadow-[0_0_40px_rgba(0,0,0,0.6)] w-[95%] max-w-4xl h-[80vh] sm:h-[85vh] flex flex-col relative overflow-hidden origin-center">
                <header class="flex justify-between items-center p-4 sm:p-6 border-b border-ink/10 bg-[#fbf8f1] shrink-0">
                    <div class="flex flex-col">
                        <p class="text-ink/60 text-[10px] sm:text-xs tracking-[0.3em] font-sans font-medium uppercase mb-1">We Stand Our Watch</p>
                        <h2 id="modal-title" class="font-serif text-xl sm:text-3xl font-bold text-ink m-0">Modal Title</h2>
                    </div>
                    <button onclick="closeModal()" class="text-ink/50 hover:text-ink hover:bg-ink/5 transition-colors w-10 h-10 flex justify-center items-center rounded-full text-xl focus:outline-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </header>
                <div id="modal-body" class="flex-1 overflow-y-auto p-4 sm:p-8 bg-parchment text-ink font-serif text-lg leading-relaxed"></div>
            </div>
        </div>
    </main>

    <script>
        const modalData = {
            'story': {
                title: "Our Story",
                content: `<p class="mb-4">From our very first commissioning to our final patrol, the 55 Crew has weathered every storm together. We stood our watch through countless days and nights, forging an unbreakable bond.</p>
                          <img src="https://placehold.co/800x400/2a2626/f4f1ea?text=Historical+Ship+Photo" class="w-full h-auto rounded shadow-md border border-ink/20 mb-4" alt="Historical photo">
                          <p>This ship was more than steel and engines; it was our home away from home.</p>`
            },
            'awards': {
                title: "Our Awards",
                content: `<ul class="list-disc pl-6 space-y-4">
                            <li><strong>Best Fleet Unit (2023)</strong> - Recognized for outstanding operational readiness.</li>
                            <li><strong>Excellence in Navigation</strong> - For zero safety incidents during our longest deployment.</li>
                            <li><strong>Commendation of Service</strong> - Awarded during the joint regional maritime exercises.</li>
                          </ul>`
            },
            'crew': {
                title: "Meet Our Crew",
                content: `<p class="mb-4">The heart of this vessel is the men and women who served aboard her.</p>
                          <img src="https://placehold.co/800x500/2a2626/f4f1ea?text=Full+Crew+Roster" class="w-full h-auto rounded shadow-md border border-ink/20" alt="Crew roster">`
            }
        };

        const momentsData = [
            { type: 'image', src: 'https://placehold.co/400x400/1a293b/e4d5b7?text=Moment+1', caption: 'The whole team standing watch.' },
            { type: 'image', src: 'https://placehold.co/400x400/603e2e/e4d5b7?text=Moment+2', caption: 'Before the madness began! It was a great day with the crew.' },
            { type: 'video', src: 'https://www.w3schools.com/html/mov_bbb.mp4', caption: 'Racing down the water slides at Wild Wild Wet!' }
        ];

        const messagesData = [
            `"Fair winds and following seas to the best crew I've ever served with." - CPT Tan`,
            `"We stood our watch, and we did it well. I'll miss this old ship." - ME2 Pillay`,
            `"To the engineers who kept us afloat through all those long nights during the regional maritime exercises, thank you for your incredible dedication and hard work. We couldn't have done it without you!" - LTA Wong`
        ];
        
        let currentMoment = 0;
        let currentMessage = 0;

        function renderMoment() {
            const container = document.getElementById('moments-content');
            const data = momentsData[currentMoment];
            
            container.style.opacity = 0;
            
            setTimeout(() => {
                let mediaHtml = '';
                if (data.type === 'image') {
                    mediaHtml = `<img src="${data.src}" class="moment-media" alt="Crew Moment">`;
                } else if (data.type === 'video') {
                    mediaHtml = `<video src="${data.src}" class="moment-media" autoplay loop muted playsinline></video>`;
                }
                
                let captionHtml = data.caption ? `<div class="moment-caption" id="current-caption-box">${data.caption}</div>` : '';
                
                container.innerHTML = `<div class="moment-wrapper">${mediaHtml}${captionHtml}</div>`;
                
                if (data.caption) {
                    const captionBox = document.getElementById('current-caption-box');
                    let fontSize = 1.6; 
                    captionBox.style.fontSize = fontSize + 'rem';
                    
                    requestAnimationFrame(() => {
                        while (captionBox.scrollHeight > captionBox.clientHeight && fontSize > 0.6) {
                            fontSize -= 0.05;
                            captionBox.style.fontSize = fontSize + 'rem';
                        }
                        container.style.opacity = 1;
                    });
                } else {
                    container.style.opacity = 1;
                }
            }, 150); 
        }

        function renderMessage() {
            const container = document.getElementById('messages-content');
            const text = messagesData[currentMessage];
            
            container.style.opacity = 0;
            setTimeout(() => {
                container.innerHTML = `<div class="message-note" id="current-message-box">${text}</div>`;
                
                const note = document.getElementById('current-message-box');
                let fontSize = 3.0; 
                note.style.fontSize = fontSize + 'rem';
                
                requestAnimationFrame(() => {
                    while (note.scrollHeight > container.clientHeight * 0.95 && fontSize > 0.5) {
                        fontSize -= 0.1;
                        note.style.fontSize = fontSize + 'rem';
                    }
                    container.style.opacity = 1;
                });
            }, 150);
        }

        function changeMoment(dir) {
            currentMoment += dir;
            if (currentMoment >= momentsData.length) currentMoment = 0;
            if (currentMoment < 0) currentMoment = momentsData.length - 1;
            renderMoment();
        }

        function changeMessage(dir) {
            currentMessage += dir;
            if (currentMessage >= messagesData.length) currentMessage = 0;
            if (currentMessage < 0) currentMessage = messagesData.length - 1;
            renderMessage();
        }

        renderMoment();
        renderMessage();

        function addSwipeListener(elementId, callbackPrev, callbackNext) {
            const el = document.getElementById(elementId);
            let touchstartX = 0;
            let touchendX = 0;

            el.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, {passive: true});

            el.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});

            function handleSwipe() {
                const threshold = 30; 
                if (touchendX < touchstartX - threshold) callbackNext(); 
                if (touchendX > touchstartX + threshold) callbackPrev(); 
            }
        }

        addSwipeListener('moments-carousel', () => changeMoment(-1), () => changeMoment(1));
        addSwipeListener('messages-carousel', () => changeMessage(-1), () => changeMessage(1));

        const modal = document.getElementById('gallery-modal');
        const modalContent = document.getElementById('modal-content-wrapper');

        function syncVisualViewport() {
            if (!modal.classList.contains('active') || !window.visualViewport) return;
            const scale = window.visualViewport.scale;
            const layoutCenterX = window.innerWidth / 2;
            const layoutCenterY = window.innerHeight / 2;
            const visualCenterX = window.visualViewport.offsetLeft + (window.visualViewport.width / 2);
            const visualCenterY = window.visualViewport.offsetTop + (window.visualViewport.height / 2);
            const tx = visualCenterX - layoutCenterX;
            const ty = visualCenterY - layoutCenterY;
            modalContent.style.transform = `translate(${tx}px, ${ty}px) scale(${1 / scale})`;
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncVisualViewport);
            window.visualViewport.addEventListener('scroll', syncVisualViewport);
        }

        function openModal(key) {
            const data = modalData[key];
            if (!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-body').innerHTML = data.content;
            document.body.classList.add('modal-open');
            modal.classList.add('active');
            if (window.visualViewport) {
                syncVisualViewport();
            } else {
                modalContent.style.transform = 'translate(0, 0) scale(1)';
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.classList.remove('modal-open');
            modalContent.style.transform = 'translate(0, 0) scale(1)';
            setTimeout(() => { document.getElementById('modal-body').innerHTML = ''; }, 300);
        }

        modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    </script>
</body>
</html>
